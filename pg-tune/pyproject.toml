[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-tune"
version = "0.1.0a1"
description = "Write-capable tuning companion to pg-explain-mcp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pg-explain-mcp",
    "mcp>=1.0.0,<2.0.0",
    "psycopg[binary]>=3.0"
]

[tool.uv.sources]
pg-explain-mcp = { workspace = true }

[project.scripts]
pg-tune-mcp = "pg_tune.server:main"
pg-tune-backup  = "pg_tune.cli:backup_main"
pg-tune-list-backups = "pg_tune.cli:list_backups_main"
pg-tune-restore = "pg_tune.cli:restore_main"
pg-tune-config = "pg_tune.cli:config_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: requires a live PostgreSQL (set PG_TEST_INTEGRATION=1)",
]

