[project]
name = "utils"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.14.0",
    "fastmcp>=4.1.3",
    "psycopg[binary]>=3.1.0",
    "ruff>=0.17.1",
]
[project.scripts]
book-search-mcp = "tools.server:main"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tools", "chapter_parser"]

