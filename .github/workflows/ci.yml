name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff — pg-explain-mcp
        run: ruff check src tests

      - name: Ruff — pg-tune
        working-directory: pg-tune
        run: ruff check src tests

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            pg-tune/pyproject.toml

      - name: Install pg-explain-mcp
        run: pip install -e .

      - name: Install pg-tune
        working-directory: pg-tune
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest psycopg[binary]

      - name: Unit tests — pg-explain-mcp
        run: pytest tests -v

      - name: Unit tests — pg-tune
        working-directory: pg-tune
        run: pytest -v

  integration:
    name: integration (pg${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            pg-tune/pyproject.toml

      - name: Install pg-explain-mcp
        run: pip install -e .

      - name: Install pg-tune
        working-directory: pg-tune
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest psycopg[binary]

      - name: Install pg_dump / pg_restore for the matrix version
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-${{ matrix.postgres-version }}

      - name: Check pg_dump / server version match
        run: |
          pg_dump --version
          psql --version
          psql -h localhost -U postgres -c "select version()"
        env:
          PGPASSWORD: postgres

      - name: Integration tests
        working-directory: pg-tune
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PG_TEST_INTEGRATION: "1"
        run: pytest tests/test_integration_backup_restore.py -v

